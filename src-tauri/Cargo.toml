[package]
name = "hera"
version = "0.1.0"
description = "HERA — Hyperdimensional Engine for Reasoning and Analysis"
authors = ["Matt Kilcoyne"]
edition = "2021"

[[bin]]
name = "hera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

pdf-extract = "0.7"
docx-rust = "0.1"
calamine = "0.24"
csv = "1.3"
quick-xml = "0.36"

reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking"] }
futures-util = "0.3"

serialport = "4"
rumqttc = "0.24"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
notify = "6"

sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
strip = true
