[package]
name = "hera"
version = "0.1.0"
description = "HERA — Hyperdimensional Engine for Reasoning and Analysis"
authors = ["Matt Kilcoyne"]
edition = "2021"

[[bin]]
name = "hera"
path = "src/main.rs"

[dependencies]
# Tauri
tauri = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Document ingestion
pdf-extract = "0.7"                      # PDF text extraction
docx-rust = "0.1"                        # DOCX parsing
calamine = "0.24"                        # XLSX/XLS
csv = "1.3"                              # CSV
quick-xml = { version = "0.36", features = ["serialize"] }  # XML/HTML

# Image OCR (optional, feature-gated)
# tesseract = "0.13"                     # Uncomment if tesseract installed

# HTTP / live data
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Serial / USB device comms
serialport = "4"

# MQTT for IoT streams
rumqttc = "0.24"

# WebSocket streams
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# File watching (live folder ingest)
notify = "6"

# Hashing / encoding
sha2 = "0.10"
base64 = "0.22"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID for document IDs
uuid = { version = "1", features = ["v4"] }

# Regex for text processing
regex = "1"

[features]
# by default Tauri runs in production mode
# `tauri dev` sets custom_protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
strip = true
